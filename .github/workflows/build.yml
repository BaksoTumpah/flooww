name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# izin tulis diperlukan agar workflow bisa mengirim commit kenaikan versi dan changelog
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: ${{ vars.RELEASE_REPO }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Versi naik otomatis satu angka tiap push ke main, dan catatan perubahan (changelog.json) bertambah.
      # Lewati kenaikan dengan menaruh [skip bump] di pesan commit. Bila commit sendiri sudah mengubah versionCode, tidak dinaikkan lagi.
      - name: Naikkan versi dan catat changelog
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          MSG=$(git log -1 --pretty=%B)
          OLD=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          if echo "$MSG" | grep -q '\[skip bump\]'; then
            echo "Lewati kenaikan versi."
            exit 0
          fi
          DIFF=$(git diff HEAD~1 HEAD -- app/build.gradle.kts || true)
          if echo "$DIFF" | grep -q '^+.*versionCode'; then
            NEW=$OLD
          else
            NEW=$((OLD+1))
            sed -i "s/versionCode = $OLD/versionCode = $NEW/; s/versionName = \"[0-9.]*\"/versionName = \"$NEW\"/" app/build.gradle.kts
          fi
          SUBJ=$(git log -1 --pretty=%s | tr -d '"\\')
          BODY=$( (git log -1 --pretty=%b | grep -v -e '^Co-Authored-By' -e '^Claude-Session' || true) | tr '\n' ' ' | tr -d '"\\' | sed 's/ *$//')
          NOTE="$SUBJ"
          if [ -n "$BODY" ]; then NOTE="$SUBJ. $BODY"; fi
          [ -f changelog.json ] || echo '[]' > changelog.json
          jq --argjson v "$NEW" --arg n "$NOTE" 'map(select(.v != $v)) + [{v:$v,n:$n}] | sort_by(.v)' changelog.json > changelog.tmp
          mv changelog.tmp changelog.json
          echo "Versi $OLD -> $NEW"

      - name: Build debug APK
        env:
          FLOOWW_KEYSTORE_B64: ${{ secrets.FLOOWW_KEYSTORE_B64 }}
          FLOOWW_STORE_PASSWORD: ${{ secrets.FLOOWW_STORE_PASSWORD }}
          FLOOWW_KEY_ALIAS: ${{ secrets.FLOOWW_KEY_ALIAS }}
          FLOOWW_KEY_PASSWORD: ${{ secrets.FLOOWW_KEY_PASSWORD }}
          FLOOWW_DB_URL: ${{ vars.FLOOWW_DB_URL }}
          FLOOWW_UPDATE_URL: ${{ vars.FLOOWW_UPDATE_URL }}
          FLOOWW_ADMIN_GOOGLE_CLIENT_ID: ${{ vars.FLOOWW_ADMIN_GOOGLE_CLIENT_ID }}
        run: gradle :app:assembleDebug :app:assembleRelease :admin:assembleDebug :admin:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flooww-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: flooww-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload flow admin APK debug
        uses: actions/upload-artifact@v4
        with:
          name: flow-admin-debug
          path: admin/build/outputs/apk/debug/*.apk

      - name: Upload flow admin APK release
        uses: actions/upload-artifact@v4
        with:
          name: flow-admin-release
          path: admin/build/outputs/apk/release/*.apk

      # Unggah APK rilis ke repo publik terpisah (hanya berisi APK) sebagai GitHub Release.
      # Jalan hanya bila variable RELEASE_REPO dan secret RELEASE_TOKEN sudah diisi.
      - name: Publish ke repo rilis
        if: github.ref == 'refs/heads/main' && env.RELEASE_REPO != '' && env.RELEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES=$(jq -r --argjson v "$VER" 'map(select(.v == $v)) | .[0].n // empty' changelog.json 2>/dev/null || true)
          if [ -z "$NOTES" ]; then NOTES=$(git log -1 --pretty=%s | tr -d '"\\'); fi
          mkdir -p rel
          cp "$APK" rel/flooww.apk
          # changelog: 40 versi terakhir. Aplikasi memilih sendiri versi yang lebih baru dari yang terpasang.
          [ -f changelog.json ] || echo '[]' > changelog.json
          jq -n --argjson version "$VER" --arg url "https://github.com/$RELEASE_REPO/releases/download/v$VER/flooww.apk" \
            --arg notes "$NOTES" --arg sha "$SHA" --slurpfile cl changelog.json \
            '{version:$version,url:$url,notes:$notes,sha256:$sha,changelog:($cl[0] | sort_by(.v) | .[-40:])}' > rel/update.json
          cat rel/update.json
          if gh release view "v$VER" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "v$VER" rel/flooww.apk rel/update.json --clobber --repo "$RELEASE_REPO"
          else
            gh release create "v$VER" rel/flooww.apk rel/update.json --repo "$RELEASE_REPO" --title "flooww versi $VER" --notes "$NOTES" --latest
          fi

      # APK flow admin: rilis bernama tetap "admin" di repo rilis yang sama, TIDAK ditandai latest.
      # Dengan begitu tombol unduh flooww dan pembaruan aplikasi pengguna (yang membaca "latest") tidak terpengaruh.
      - name: Publish flow admin ke repo rilis
        if: github.ref == 'refs/heads/main' && env.RELEASE_REPO != '' && env.RELEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          AVER=$(grep -oP 'versionCode = \K[0-9]+' admin/build.gradle.kts | head -1)
          AAPK=$(ls admin/build/outputs/apk/release/*.apk | head -1)
          ASHA=$(sha256sum "$AAPK" | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s | tr -d '"\\')
          mkdir -p rel-admin
          cp "$AAPK" rel-admin/flow-admin.apk
          printf '{"version":%s,"url":"https://github.com/%s/releases/download/admin/flow-admin.apk","notes":"%s","sha256":"%s"}\n' "$AVER" "$RELEASE_REPO" "$NOTES" "$ASHA" > rel-admin/admin.json
          cat rel-admin/admin.json
          if gh release view admin --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload admin rel-admin/flow-admin.apk rel-admin/admin.json --clobber --repo "$RELEASE_REPO"
            gh release edit admin --repo "$RELEASE_REPO" --title "flow admin versi $AVER" --notes "$NOTES" --latest=false
          else
            gh release create admin rel-admin/flow-admin.apk rel-admin/admin.json --repo "$RELEASE_REPO" --title "flow admin versi $AVER" --notes "$NOTES" --latest=false
          fi

      # Kirim kenaikan versi dan changelog kembali ke main. [skip ci] dan token bawaan mencegah build berulang.
      - name: Simpan versi dan changelog ke repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts changelog.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan versi."
            exit 0
          fi
          VER=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          git commit -m "Versi app $VER [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || true
          done
          echo "::warning::Gagal mengirim kenaikan versi ke main."
