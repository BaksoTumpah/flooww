name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          FLOOWW_KEYSTORE_B64: ${{ secrets.FLOOWW_KEYSTORE_B64 }}
          FLOOWW_STORE_PASSWORD: ${{ secrets.FLOOWW_STORE_PASSWORD }}
          FLOOWW_KEY_ALIAS: ${{ secrets.FLOOWW_KEY_ALIAS }}
          FLOOWW_KEY_PASSWORD: ${{ secrets.FLOOWW_KEY_PASSWORD }}
          FLOOWW_DB_URL: ${{ vars.FLOOWW_DB_URL }}
          FLOOWW_UPDATE_URL: ${{ vars.FLOOWW_UPDATE_URL }}
          FLOOWW_ADMIN_GOOGLE_CLIENT_ID: ${{ vars.FLOOWW_ADMIN_GOOGLE_CLIENT_ID }}
        run: gradle :app:assembleDebug :app:assembleRelease :admin:assembleDebug :admin:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flooww-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: flooww-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload flow admin APK debug
        uses: actions/upload-artifact@v4
        with:
          name: flow-admin-debug
          path: admin/build/outputs/apk/debug/*.apk

      - name: Upload flow admin APK release
        uses: actions/upload-artifact@v4
        with:
          name: flow-admin-release
          path: admin/build/outputs/apk/release/*.apk

      # Unggah APK rilis ke Cloudflare R2 (link unduhan publik mandiri) setiap build di main.
      # Jalan hanya bila secret/variable R2 sudah diisi.
      - name: Publish ke Cloudflare R2
        if: github.ref == 'refs/heads/main' && env.R2_BUCKET != '' && env.R2_ACCOUNT_ID != '' && env.R2_PUBLIC_URL != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          VER=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          BASE="${R2_PUBLIC_URL%/}"
          NOTES=$(git log -1 --pretty=%s | tr -d '"\\')
          mkdir -p r2
          cp "$APK" "r2/flooww-$VER.apk"
          cp "$APK" "r2/flooww-latest.apk"
          printf '{"version":%s,"url":"%s/flooww-%s.apk","notes":"%s","sha256":"%s"}\n' "$VER" "$BASE" "$VER" "$NOTES" "$SHA" > r2/update.json
          cat r2/update.json
          EP="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          APKT="application/vnd.android.package-archive"
          aws s3 cp "r2/flooww-$VER.apk" "s3://$R2_BUCKET/flooww-$VER.apk" --endpoint-url "$EP" --content-type "$APKT" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "r2/flooww-latest.apk" "s3://$R2_BUCKET/flooww-latest.apk" --endpoint-url "$EP" --content-type "$APKT" --cache-control "no-cache"
          aws s3 cp r2/update.json "s3://$R2_BUCKET/update.json" --endpoint-url "$EP" --content-type "application/json" --cache-control "no-cache"
