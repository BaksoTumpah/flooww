name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: ${{ vars.RELEASE_REPO }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          FLOOWW_KEYSTORE_B64: ${{ secrets.FLOOWW_KEYSTORE_B64 }}
          FLOOWW_STORE_PASSWORD: ${{ secrets.FLOOWW_STORE_PASSWORD }}
          FLOOWW_KEY_ALIAS: ${{ secrets.FLOOWW_KEY_ALIAS }}
          FLOOWW_KEY_PASSWORD: ${{ secrets.FLOOWW_KEY_PASSWORD }}
          FLOOWW_DB_URL: ${{ vars.FLOOWW_DB_URL }}
          FLOOWW_UPDATE_URL: ${{ vars.FLOOWW_UPDATE_URL }}
          FLOOWW_ADMIN_GOOGLE_CLIENT_ID: ${{ vars.FLOOWW_ADMIN_GOOGLE_CLIENT_ID }}
        run: gradle :app:assembleDebug :app:assembleRelease :admin:assembleDebug :admin:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flooww-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: flooww-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload flow admin APK debug
        uses: actions/upload-artifact@v4
        with:
          name: flow-admin-debug
          path: admin/build/outputs/apk/debug/*.apk

      - name: Upload flow admin APK release
        uses: actions/upload-artifact@v4
        with:
          name: flow-admin-release
          path: admin/build/outputs/apk/release/*.apk

      # Unggah APK rilis ke repo publik terpisah (hanya berisi APK) sebagai GitHub Release.
      # Jalan hanya bila variable RELEASE_REPO dan secret RELEASE_TOKEN sudah diisi.
      - name: Publish ke repo rilis
        if: github.ref == 'refs/heads/main' && env.RELEASE_REPO != '' && env.RELEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%s | tr -d '"\\')
          mkdir -p rel
          cp "$APK" rel/flooww.apk
          printf '{"version":%s,"url":"https://github.com/%s/releases/download/v%s/flooww.apk","notes":"%s","sha256":"%s"}\n' "$VER" "$RELEASE_REPO" "$VER" "$NOTES" "$SHA" > rel/update.json
          cat rel/update.json
          if gh release view "v$VER" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "v$VER" rel/flooww.apk rel/update.json --clobber --repo "$RELEASE_REPO"
          else
            gh release create "v$VER" rel/flooww.apk rel/update.json --repo "$RELEASE_REPO" --title "flooww versi $VER" --notes "$NOTES" --latest
          fi
