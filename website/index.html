<style>
/* Layout: kiri-rata. Situs publik dan panel /developer memakai satu data konten.
   Semua ukuran dalam rem, jadi satu angka di html mengecilkan atau membesarkan seluruh halaman (HP sampai TV).
   Warna dari pita ikon: biru, ungu, hijau, kuning, koral, cyan. */
:root {
  --bg: #081030;
  --screen: #0B153C;
  --surface: #0F1B4A;
  --raise: #16256A;
  --line: #26357D;
  --fg: #EAF0FF;
  --muted: #A9B5E0;
  --blue: #4FA8FF;
  --violet: #9A7BF5;
  --mint: #3DDC97;
  --amber: #FFB547;
  --coral: #FF7A8A;
  --cyan: #38D0E6;
  --accent: var(--blue);
  --accent-ink: #04122E;
  --tile-ink: #04122E;
  --bubble: #0D1A45;
  --wa: #0F8A47;
  --wa-ink: #FFFFFF;
  --glow: 30%;
  --glow2: 15%;
  --font-display: 'Unbounded', 'Trebuchet MS', sans-serif;
  --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F5FF; --screen: #E6ECFF; --surface: #FFFFFF; --raise: #DCE5FF; --line: #C4D0F2;
    --fg: #0D1A45; --muted: #46548A;
    --blue: #1B66D6; --violet: #6A4DD6; --mint: #0E8F5C; --amber: #A85F00; --coral: #D0364F; --cyan: #0A7F95;
    --accent-ink: #FFFFFF; --tile-ink: #FFFFFF; --glow: 20%; --glow2: 10%;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F5FF; --screen: #E6ECFF; --surface: #FFFFFF; --raise: #DCE5FF; --line: #C4D0F2;
  --fg: #0D1A45; --muted: #46548A;
  --blue: #1B66D6; --violet: #6A4DD6; --mint: #0E8F5C; --amber: #A85F00; --coral: #D0364F; --cyan: #0A7F95;
  --accent-ink: #FFFFFF; --tile-ink: #FFFFFF; --glow: 20%; --glow2: 10%;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.6 var(--font-body); -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
h1, h2, h3, p, ul, ol, dl, figure { margin: 0; }
h2 { font: 600 clamp(1.35rem, 3.6vw, 1.9rem)/1.2 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
h3 { font: 600 1.02rem/1.3 var(--font-display); letter-spacing: -0.01em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 0.22rem solid var(--accent); outline-offset: 0.2rem; }

.in { max-width: 68rem; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sec { --c: var(--blue); padding-block: clamp(3rem, 8vw, 5.75rem); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, var(--bg)), var(--bg) 70%); }
.lead-in { color: var(--muted); max-width: 58ch; margin-top: 0.9rem; }
.sh { display: flex; align-items: center; gap: 0.9rem; }
.chip { flex: none; width: 2.9rem; height: 2.9rem; border-radius: 0.9rem; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 20%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.chip svg { width: 1.5rem; height: 1.5rem; }
.ico { width: 1.25rem; height: 1.25rem; flex: none; }

/* header + hero */
.hero-wrap {
  background:
    radial-gradient(55% 60% at 6% 0%, color-mix(in srgb, var(--blue) var(--glow), transparent), transparent 70%),
    radial-gradient(45% 55% at 96% 16%, color-mix(in srgb, var(--violet) var(--glow), transparent), transparent 72%),
    radial-gradient(42% 45% at 58% 100%, color-mix(in srgb, var(--mint) var(--glow2), transparent), transparent 72%),
    radial-gradient(30% 35% at 100% 100%, color-mix(in srgb, var(--coral) var(--glow2), transparent), transparent 72%),
    var(--bg);
}
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.4rem 1rem; padding-block: 1rem; }
.brand { display: inline-flex; align-items: center; gap: 0.65rem; color: var(--fg); text-decoration: none; font: 800 1.15rem var(--font-display); letter-spacing: -0.03em; }
.brand svg { width: 2.1rem; height: 2.1rem; }
.nav { display: flex; gap: 0.15rem; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; padding: 0 0.75rem; border-radius: 0.65rem; font-weight: 600; min-height: 2.75rem; display: inline-flex; align-items: center; }
.nav a:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 8%, transparent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem; min-height: 3rem; padding: 0 1.3rem; border-radius: 0.9rem; font: 700 1rem var(--font-body); text-decoration: none; border: 1px solid transparent; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn-primary { background: linear-gradient(100deg, var(--blue), var(--violet)); color: var(--accent-ink); box-shadow: 0 0.5rem 1.5rem color-mix(in srgb, var(--blue) 35%, transparent); }
.btn-wa { background: var(--wa); color: var(--wa-ink); box-shadow: 0 0.5rem 1.5rem color-mix(in srgb, var(--wa) 38%, transparent); }
.btn-ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn-sm { min-height: 2.75rem; padding: 0 1rem; font-size: 0.92rem; }
.btn svg { width: 1.25rem; height: 1.25rem; flex: none; }
.cta { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.75rem; }

.hero { display: grid; grid-template-columns: 1fr; gap: 2.75rem; padding-block: clamp(1.25rem, 5vw, 3.5rem) clamp(3rem, 8vw, 5.75rem); }
.hero > * { min-width: 0; }
.wordmark { font: 800 clamp(2.8rem, 9vw, 5.6rem)/1 var(--font-display); letter-spacing: -0.045em; padding-bottom: 0.08em; color: var(--fg); background: linear-gradient(100deg, var(--blue) 5%, var(--violet) 52%, var(--coral) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; overflow-wrap: anywhere; }
.tagline { font: 600 clamp(1.15rem, 2.6vw, 1.5rem)/1.3 var(--font-display); letter-spacing: -0.02em; margin-top: 1rem; text-wrap: balance; }
.sub { color: var(--muted); max-width: 46ch; margin-top: 0.9rem; }
.pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
.pill { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 2.75rem; padding: 0 1rem; border-radius: 999px; font-size: 0.9rem; font-weight: 600; text-decoration: none; color: var(--fg); background: color-mix(in srgb, var(--c) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 48%, transparent); }
.pill i { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--c); }
.pill:hover { background: color-mix(in srgb, var(--c) 26%, var(--surface)); }
.fine { color: var(--muted); font-size: 0.9rem; margin-top: 1rem; }

/* demo bubble */
.demo { max-width: 27.5rem; width: 100%; }
.screen { position: relative; display: flex; flex-direction: column; gap: 1rem; min-height: 25.6rem; padding: 1.1rem; overflow: hidden; background: linear-gradient(160deg, color-mix(in srgb, var(--violet) 16%, var(--screen)), var(--screen) 62%); border: 1px solid color-mix(in srgb, var(--violet) 40%, var(--line)); border-radius: 1.75rem; box-shadow: 0 1.5rem 3.75rem color-mix(in srgb, var(--violet) 22%, transparent); }
.fake { position: absolute; inset: 0; padding: 1.6rem 1.35rem; display: flex; flex-direction: column; gap: 0.85rem; pointer-events: none; }
.fake i { display: block; height: 0.55rem; border-radius: 0.3rem; background: var(--line); opacity: 0.75; }
.fake i:nth-child(1) { width: 78%; } .fake i:nth-child(2) { width: 92%; } .fake i:nth-child(3) { width: 64%; }
.fake i:nth-child(4) { width: 86%; } .fake i:nth-child(5) { width: 70%; } .fake i:nth-child(6) { width: 88%; }
.fake i:nth-child(7) { width: 52%; } .fake i:nth-child(8) { width: 80%; } .fake i:nth-child(9) { width: 60%; }
.fake b { position: absolute; right: 8%; top: 36%; width: 46%; height: 28%; border: 2px dashed var(--coral); border-radius: 50%; opacity: 0.7; }
.float { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 0.75rem; }
.bubble { flex: none; width: 3.6rem; height: 3.6rem; border-radius: 50%; padding: 0; cursor: pointer; display: grid; place-items: center; background: var(--bubble); border: 1px solid color-mix(in srgb, var(--blue) 50%, var(--line)); box-shadow: 0 0 0 0.4rem color-mix(in srgb, var(--blue) 18%, transparent), 0 0.5rem 1.4rem rgba(0, 0, 0, 0.35); }
.bubble svg { width: 2.4rem; height: 2.4rem; }
.menu { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; flex: 1; min-width: 0; max-width: 17.25rem; transform-origin: 0 1.5rem; animation: pop 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.tool { aspect-ratio: 1; min-width: 0; padding: 0.25rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.3rem; text-align: center; font: 700 0.7rem/1.1 var(--font-body); color: var(--fg); background: color-mix(in srgb, var(--c) 17%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); border-radius: 0.9rem; }
.tool svg { width: 1.4rem; height: 1.4rem; color: var(--c); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: color-mix(in srgb, var(--c) 28%, var(--surface)); }
.tool[aria-pressed="true"] { background: var(--c); color: var(--tile-ink); border-color: var(--c); }
.tool[aria-pressed="true"] svg { color: var(--tile-ink); }
.tip { position: relative; z-index: 1; margin-top: auto; padding: 0.9rem 1rem; border-radius: 1rem; background: var(--surface); border: 1px solid color-mix(in srgb, var(--c, var(--blue)) 55%, var(--line)); font-size: 0.95rem; }
.tip strong { display: block; font: 600 0.95rem var(--font-display); color: var(--c, var(--blue)); margin-bottom: 0.25rem; }
.demo figcaption { color: var(--muted); font-size: 0.88rem; margin-top: 0.75rem; }
@keyframes pop { from { transform: scale(0.88); } to { transform: scale(1); } }

/* aman */
.claims { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 0.9rem; margin-top: 2.1rem; }
.claims > * { min-width: 0; }
.claim { padding: 1.35rem; border-radius: 1.25rem; display: grid; gap: 0.65rem; align-content: start; background: color-mix(in srgb, var(--c) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 34%, var(--line)); }
.claim p { color: var(--muted); }
.claim a { font-weight: 700; color: var(--c); }
.perms { margin-top: 2.75rem; }
.perms ul { list-style: none; padding: 0; margin-top: 0.9rem; }
.perms li { --c: var(--blue); display: grid; grid-template-columns: 0.75rem minmax(0, 1fr); gap: 0.25rem 0.9rem; padding: 0.9rem 0; border-top: 1px solid color-mix(in srgb, var(--c) 30%, var(--line)); }
.perms li:last-child { border-bottom: 1px solid color-mix(in srgb, var(--c) 30%, var(--line)); }
.perms li::before { content: ""; width: 0.75rem; height: 0.75rem; margin-top: 0.45rem; border-radius: 50%; background: var(--c); grid-row: 1 / span 2; }
.perms li:nth-child(6n+2) { --c: var(--violet); } .perms li:nth-child(6n+3) { --c: var(--mint); }
.perms li:nth-child(6n+4) { --c: var(--amber); } .perms li:nth-child(6n+5) { --c: var(--coral); } .perms li:nth-child(6n+6) { --c: var(--cyan); }
.perms strong { font-weight: 700; }
.perms span { color: var(--muted); }
.honest { --c: var(--amber); display: grid; grid-template-columns: 2.9rem minmax(0, 1fr); gap: 1rem; align-items: start; margin-top: 2.25rem; padding: 1.35rem; border-radius: 1.25rem; background: color-mix(in srgb, var(--c) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); }
.honest p + p { margin-top: 0.5rem; }
.honest strong { display: block; font: 600 1rem var(--font-display); margin-bottom: 0.4rem; }

/* unduh */
.dl-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem; margin-top: 2.25rem; }
.dl-grid > * { min-width: 0; }
.spec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.65rem; }
.spec div { --c: var(--blue); padding: 0.9rem 1rem; border-radius: 1rem; background: color-mix(in srgb, var(--c) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 36%, var(--line)); }
.spec div:nth-child(6n+2) { --c: var(--mint); } .spec div:nth-child(6n+3) { --c: var(--violet); }
.spec div:nth-child(6n+4) { --c: var(--amber); } .spec div:nth-child(6n+5) { --c: var(--cyan); } .spec div:nth-child(6n+6) { --c: var(--coral); }
.spec div:last-child:nth-child(odd) { grid-column: 1 / -1; }
.spec dt { color: var(--c); font-size: 0.85rem; font-weight: 700; }
.spec dd { margin: 0.1rem 0 0; font-weight: 600; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 0.9em; font-weight: 500; }
.dl-cta { margin-top: 1.5rem; }
.steps { list-style: none; padding: 0; display: grid; gap: 1.1rem; counter-reset: s; }
.steps li { --c: var(--blue); display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: 0.9rem; align-items: start; max-width: 56ch; counter-increment: s; }
.steps li:nth-child(6n+2) { --c: var(--violet); } .steps li:nth-child(6n+3) { --c: var(--amber); } .steps li:nth-child(6n+4) { --c: var(--mint); }
.steps li:nth-child(6n+5) { --c: var(--coral); } .steps li:nth-child(6n+6) { --c: var(--cyan); }
.steps li::before { content: counter(s); width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; display: grid; place-items: center; font: 500 1rem var(--font-mono); color: var(--tile-ink); background: var(--c); }
.steps strong { display: block; }
.up-h { margin: 2.25rem 0 1.1rem; font-size: 1.2rem; }
.steps span { color: var(--muted); }

/* lisensi */
.lic-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem; margin-top: 2.25rem; align-items: start; }
.lic-grid > * { min-width: 0; }
.receipt { position: relative; overflow: hidden; background: var(--surface); border: 1px solid color-mix(in srgb, var(--amber) 40%, var(--line)); border-radius: 1.1rem; padding: 1.75rem 1.35rem 1.35rem; font-family: var(--font-mono); max-width: 28.75rem; box-shadow: 0 1.25rem 3.1rem color-mix(in srgb, var(--amber) 14%, transparent); }
.receipt::before { content: ""; position: absolute; inset: 0 0 auto; height: 0.5rem; background: linear-gradient(90deg, var(--amber), var(--coral), var(--violet)); }
.receipt .head { display: flex; justify-content: space-between; gap: 0.75rem; color: var(--muted); font-size: 0.85rem; }
.receipt .tk { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.25rem 0; font-size: clamp(1.15rem, 4.6vw, 1.6rem); font-weight: 500; letter-spacing: 0.04em; }
.receipt .tk span { padding: 0.08em 0.42em; border-radius: 0.5rem; background: color-mix(in srgb, var(--amber) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); }
.receipt .cut { border-top: 2px dashed var(--line); padding-top: 0.9rem; color: var(--muted); font-size: 0.82rem; line-height: 1.5; }

/* kontak, footer, tombol melayang */
.wa-panel { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.5rem; margin-top: 1.9rem; padding: clamp(1.25rem, 4vw, 2rem); border-radius: 1.5rem; background: linear-gradient(135deg, color-mix(in srgb, var(--mint) 22%, var(--surface)), color-mix(in srgb, var(--cyan) 14%, var(--surface))); border: 1px solid color-mix(in srgb, var(--mint) 45%, var(--line)); }
.wa-num { font: 500 clamp(1.3rem, 5vw, 1.9rem) var(--font-mono); letter-spacing: 0.02em; overflow-wrap: anywhere; user-select: all; flex: 1 1 100%; }
.foot { padding-block: 1.75rem 6rem; color: var(--muted); font-size: 0.9rem; }
.foot nav { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; margin-bottom: 0.6rem; }
.foot nav a { color: var(--muted); }
.fab { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.draftbar { background: color-mix(in srgb, var(--amber) 22%, var(--surface)); border-bottom: 1px solid color-mix(in srgb, var(--amber) 50%, var(--line)); font-size: 0.9rem; }
.draftbar .in { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1rem; padding-block: 0.4rem; }
.draftbar button, .draftbar a { background: none; border: 0; padding: 0 0.25rem; min-height: 2.75rem; color: var(--fg); font-weight: 700; text-decoration: underline; cursor: pointer; }

/* login developer */
.lg { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 2rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(60% 50% at 20% 0%, color-mix(in srgb, var(--blue) var(--glow), transparent), transparent 70%), radial-gradient(50% 50% at 90% 100%, color-mix(in srgb, var(--violet) var(--glow), transparent), transparent 70%), var(--bg); }
.lg-card { width: min(100%, 25rem); padding: 1.75rem; border-radius: 1.5rem; display: grid; gap: 0.85rem; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1.5rem 3.75rem color-mix(in srgb, var(--violet) 22%, transparent); }
.lg-card svg.lg-mark { width: 3rem; height: 3rem; }
.lg-card h1 { font: 800 1.45rem/1.2 var(--font-display); letter-spacing: -0.03em; }
.lg-card p { color: var(--muted); }
.lg-card label { font-weight: 700; font-size: 0.9rem; }
.lg-card input[type="text"], .lg-card input[type="password"] { width: 100%; min-height: 3rem; padding: 0 0.9rem; font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 0.75rem; }
.chk { display: flex; align-items: center; gap: 0.6rem; font-weight: 500 !important; min-height: 2.75rem; }
.chk input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); }
.lg-err { color: var(--coral); font-weight: 600; }

/* panel developer */

    var arr = getPath(content, b.path) || [];
    var items = arr.map(function (it, i) {
      var t = b.name + ' ' + (i + 1) + (b.titleKey && it[b.titleKey] ? ': ' + String(fill(it[b.titleKey], content)).slice(0, 48) : '');
      var tools = b.fixed ? '' : '<div class="dv-ib"><button type="button" data-act="up" data-p="' + b.path + '" data-i="' + i + '" aria-label="Naikkan ' + esc(b.name) + ' ' + (i + 1) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" data-act="down" data-p="' + b.path + '" data-i="' + i + '" aria-label="Turunkan ' + esc(b.name) + ' ' + (i + 1) + '"' + (i === arr.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button type="button" class="del" data-act="del" data-p="' + b.path + '" data-i="' + i + '" aria-label="Hapus ' + esc(b.name) + ' ' + (i + 1) + '">✕</button></div>';
      return '<div class="dv-item"><div class="dv-item-h"><span>' + esc(t) + '</span>' + tools + '</div><div class="dv-grid">' +
        b.fields.map(function (f) { return fieldHTML(f, b.path + '.' + i + '.' + f.key); }).join('') + '</div></div>';
    }).join('');
    return '<section class="dv-card"><h3>' + esc(b.title) + '</h3>' + (b.fixed ? '<p class="dv-hint">Jumlah item tetap. Teksnya bisa diubah semua.</p>' : '<p class="dv-hint">Tambah, hapus, dan urutkan sesuai kebutuhan.</p>') + items +
      (b.fixed ? '' : '<button type="button" class="btn btn-ghost btn-sm dv-add" data-act="add" data-p="' + b.path + '">Tambah ' + esc(b.name.toLowerCase()) + '</button>') + '</section>';
  }
  function tayangHTML() {
    var json = JSON.stringify(content, null, 2);
    return '<section class="dv-card"><h3>Cara menayangkan</h3><ol class="dv-list">' +
      '<li><b>Edit.</b> Setiap ketikan tersimpan otomatis sebagai draf di browser ini. Hanya Anda yang melihatnya.</li>' +
      '<li><b>Unduh.</b> Tekan Unduh content.json.</li>' +
      '<li><b>Unggah.</b> Letakkan content.json di folder yang sama dengan index.html, lalu unggah ke hosting.</li>' +
      '<li><b>Muat ulang situs.</b> Teks baru tampil untuk semua pengunjung.</li></ol></section>' +
      '<section class="dv-card"><h3>Ekspor</h3><div class="dv-row"><button type="button" class="btn btn-primary btn-sm" data-act="dl">Unduh content.json</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-act="copy-json">Salin JSON</button></div>' +
      '<p class="dv-msg" id="dv-msg-x" role="status"></p>' +
      '<label for="dv-json" class="dv-hint" style="display:block;margin-top:.6rem">Isi content.json</label><textarea id="dv-json" class="dv-json" rows="10" readonly>' + esc(json) + '</textarea></section>' +
      '<section class="dv-card"><h3>Impor</h3><p class="dv-hint">Tempel isi content.json atau pilih berkasnya. Isi lama diganti.</p>' +
      '<div class="dv-file"><input type="file" id="dv-file" accept=".json,application/json" aria-label="Pilih berkas content.json"></div>' +
      '<label for="dv-imp" class="dv-hint" style="display:block;margin-top:.8rem">Tempel JSON</label><textarea id="dv-imp" class="dv-json" rows="6" placeholder="{ &quot;meta&quot;: { ... } }"></textarea>' +
      '<div class="dv-row"><button type="button" class="btn btn-ghost btn-sm" data-act="apply-import">Terapkan JSON</button></div>' +
      '<p class="dv-msg' + (dev.msg ? (dev.msgOk ? ' ok' : ' bad') : '') + '" id="dv-msg-i" role="status">' + esc(dev.msg) + '</p></section>' +
      '<section class="dv-card"><h3>Draf dan bawaan</h3><p class="dv-hint">Hapus draf untuk kembali ke versi yang tayang. Reset mengembalikan semua teks ke bawaan awal.</p>' +
      '<div class="dv-row"><button type="button" class="btn btn-ghost btn-sm" data-act="drop-draft">Hapus draf di browser ini</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-act="reset">' + (dev.confirm ? 'Yakin? Tekan sekali lagi' : 'Reset ke bawaan') + '</button></div></section>';
  }
  function panelHTML() {
    var sec = SECTIONS.filter(function (s) { return s.id === dev.section; })[0] || SECTIONS[0];
    return '<div class="dv-head"><h1>' + esc(sec.label) + '</h1><p>' + esc(sec.desc) + '</p></div>' + (sec.id === 'tayang' ? tayangHTML() : sec.blocks.map(blockHTML).join(''));
  }
  function navHTML() {
    return SECTIONS.map(function (s) { return '<button type="button" class="dv-tab" data-act="nav" data-s="' + s.id + '"' + (s.id === dev.section ? ' aria-current="page"' : '') + '>' + esc(s.label) + '</button>'; }).join('');
  }
  function renderPanel() { $('dv-nav').innerHTML = navHTML(); $('dv-panel').innerHTML = panelHTML(); }
  function devHTML() {
    return '<div class="dv"><header class="dv-top"><div class="in"><div class="dv-brand"><svg aria-hidden="true"><use href="#mark"/></svg><span>flooww developer</span></div>' +
      '<span class="dv-status" id="dv-status" role="status">' + (draft ? 'Draf tersimpan di browser ini' : 'Belum ada perubahan') + '</span>' +
      '<div class="dv-acts"><a class="btn btn-ghost btn-sm" href="' + esc(siteHref()) + '">Lihat situs</a><button type="button" class="btn btn-ghost btn-sm" data-act="logout">Keluar</button></div></div></header>' +
      '<div class="in dv-body"><nav class="dv-nav" id="dv-nav" aria-label="Bagian editor">' + navHTML() + '</nav><main class="dv-main" id="dv-panel">' + panelHTML() + '</main></div></div>';
  }
  function renderDev() {
    document.title = 'Developer · ' + fill(content.meta.title, content);
    var m = document.querySelector('meta[name="robots"]');
    if (!m) { m = document.createElement('meta'); m.name = 'robots'; document.head.appendChild(m); }
    m.content = 'noindex';
    app.innerHTML = isLogged() ? devHTML() : loginHTML();
    if (!isLogged()) bindLogin();
    window.scrollTo(0, 0);
  }

  var saveT;
  function setStatus(t) { var el = $('dv-status'); if (el) el.textContent = t; }
  function save() {
    var ok = sset('localStorage', KEY, JSON.stringify(content));
    draft = content;
    setStatus(ok ? 'Draf tersimpan di browser ini' : 'Browser menolak penyimpanan. Unduh JSON agar tidak hilang.');
  }
  function touch() {
    setStatus('Menyimpan…');
    clearTimeout(saveT); saveT = setTimeout(save, 250);
    var ta = $('dv-json'); if (ta) ta.value = JSON.stringify(content, null, 2);
  }
  function note(id, text, ok) { var el = $(id); if (!el) return; el.textContent = text; el.className = 'dv-msg ' + (ok ? 'ok' : 'bad'); }
  function selectAll(el) { try { el.focus(); el.select(); } catch (e) { } }

  function doDownload() {
    try {
      var blob = new Blob([JSON.stringify(content, null, 2)], { type: 'application/json' });
      var u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = 'content.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 1500);
      note('dv-msg-x', 'Berkas diminta. Bila tidak terunduh, pakai Salin JSON.', true);
    } catch (e) { note('dv-msg-x', 'Unduhan gagal. Pakai Salin JSON.', false); }
  }
  function doCopyJson() {
    var ta = $('dv-json'); if (!ta) return;
    function manual() { selectAll(ta); note('dv-msg-x', 'JSON terpilih. Salin manual.', true); }
    try { navigator.clipboard.writeText(ta.value).then(function () { note('dv-msg-x', 'JSON tersalin.', true); }, manual); } catch (e) { manual(); }
  }
  function doImport() {
    var ta = $('dv-imp'), raw = ta ? ta.value.trim() : '';
    if (!raw) { dev.msg = 'Tempel JSON dulu.'; dev.msgOk = false; note('dv-msg-i', dev.msg, false); return; }
    try {
      var o = JSON.parse(raw);
      if (!isObj(o)) throw new Error('bukan objek');
      content = merge(DEFAULTS, o, ''); save();
      dev.msg = 'JSON diterapkan.'; dev.msgOk = true; renderPanel();
    } catch (e) { dev.msg = 'JSON tidak valid. Periksa tanda kurung dan koma.'; dev.msgOk = false; note('dv-msg-i', dev.msg, false); }
  }

  /* ---------- satu penangan klik dan ketik untuk seluruh halaman ---------- */
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (view === 'dev' && t.getAttribute && t.getAttribute('data-p')) { setPath(content, t.getAttribute('data-p'), t.value); touch(); }
  });
  app.addEventListener('change', function (e) {
    if (e.target.id !== 'dv-file' || !e.target.files || !e.target.files[0]) return;
    var rd = new FileReader();
    rd.onload = function () { var ta = $('dv-imp'); if (ta) { ta.value = String(rd.result); note('dv-msg-i', 'Berkas dibaca. Tekan Terapkan JSON.', true); } };
    rd.readAsText(e.target.files[0]);
  });
  app.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act'), p = el.getAttribute('data-p'), i = parseInt(el.getAttribute('data-i'), 10), arr;
    switch (act) {
      case 'bubble':
        st.open = !st.open; $('menu').hidden = !st.open; el.setAttribute('aria-expanded', st.open ? 'true' : 'false'); break;
      case 'tool': selectTool(i); break;
      case 'copy-num': {
        var cp = content.kontak.copy, num = '+' + waDigits(content);
        var done = function () { el.textContent = fill(cp.done, content); setTimeout(function () { el.textContent = fill(cp.idle, content); }, 1800); };
        var manual = function () {
          var r = document.createRange(); r.selectNodeContents($('wanum'));
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); el.textContent = fill(cp.manual, content);
        };
        try { navigator.clipboard.writeText(num).then(done, manual); } catch (err) { manual(); }
        break;
      }
      case 'drop-draft':
        sdel('localStorage', KEY); compute();
        if (view === 'dev') { dev.confirm = false; renderPanel(); setStatus('Draf dihapus. Memakai versi yang tayang.'); } else { renderSite(); }
        break;
      case 'nav': dev.section = el.getAttribute('data-s'); dev.confirm = false; dev.msg = ''; renderPanel(); break;
      case 'up': case 'down':
        arr = getPath(content, p); var j = act === 'up' ? i - 1 : i + 1;
        if (j >= 0 && j < arr.length) { var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; touch(); renderPanel(); }
        break;
      case 'del':
        arr = getPath(content, p); if (arr.length > 1) { arr.splice(i, 1); touch(); renderPanel(); }
        break;
      case 'add': {
        var blk = null;
        SECTIONS.forEach(function (s) { (s.blocks || []).forEach(function (b) { if (b.t === 'l' && b.path === p) blk = b; }); });
        arr = getPath(content, p); arr.push(clone(blk.blank)); touch(); renderPanel();
        break;
      }
      case 'dl': doDownload(); break;
      case 'copy-json': doCopyJson(); break;
      case 'apply-import': doImport(); break;
      case 'reset':
        if (!dev.confirm) {
          dev.confirm = true; renderPanel();
          setTimeout(function () { if (dev.confirm && view === 'dev') { dev.confirm = false; renderPanel(); } }, 4000);
        } else { content = clone(DEFAULTS); save(); dev.confirm = false; dev.msg = 'Semua teks dikembalikan ke bawaan.'; dev.msgOk = true; renderPanel(); }
        break;
      case 'logout': sdel('sessionStorage', AUTH); renderDev(); break;
    }
  });

  /* ---------- rute: /developer (hosting) atau #developer (pratinjau) ---------- */
  function route() {
    var want = isDevRoute() ? 'dev' : 'site';
    if (want === view) return;
    view = want;
    if (view === 'dev') renderDev(); else renderSite();
  }
  window.addEventListener('hashchange', route);

  compute();
  route();

  /* baca rilis terbaru (hasil disimpan 10 menit di peramban agar tidak kena batas permintaan GitHub) */
  function applyRelease(r) {
    RELEASE = r;
    if (view === 'site') renderSite();
  }
  try {
    var cached = null;
    try { cached = JSON.parse(sessionStorage.getItem('flooww.release.v1') || 'null'); } catch (e) { }
    if (cached && cached.at && Date.now() - cached.at < 600000) {
      RELEASE = cached.r;
      renderSiteIfReady();
    } else {
      fetch('https://api.github.com/repos/BaksoTumpah/flooww-rilis/releases/latest', { headers: { Accept: 'application/vnd.github+json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!isObj(j)) return;
          var m = /\d+/.exec(String(j.tag_name || ''));
          var a = (j.assets || []).filter(function (x) { return /\.apk$/i.test(x.name || ''); })[0];
          var r = { version: m ? m[0] : '', size: a ? a.size : 0, date: j.published_at || '' };
          try { sessionStorage.setItem('flooww.release.v1', JSON.stringify({ at: Date.now(), r: r })); } catch (e) { }
          applyRelease(r);
        }, function () { });
    }
  } catch (e) { }
  function renderSiteIfReady() { if (view === 'site') renderSite(); }

  try {
    fetch(baseUrl() + 'content.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!isObj(j)) return;
        remote = j;
        if (!draft) { compute(); if (view === 'site') renderSite(); else if (view === 'dev' && isLogged()) renderPanel(); }
      }, function () { });
  } catch (e) { }
})();
</script>
